# ACL theo 15 §6.1 (PoC). %u = username = edge_id: edge chỉ publish up/# và subscribe down/# của CHÍNH nó.
pattern write ems/v1/%u/up/#
pattern read  ems/v1/%u/down/#

# ingest: đọc up/# của mọi edge (qua shared subscription $share/ingest/...); KHÔNG publish down/cmd.
# Được publish down/config chỉ để gửi TELEMETRY_ACK sau khi commit DB (07 §7.1). Khác 15 §6.1 (ingest
# chỉ subscribe) — production có thể tách thành dịch vụ ack riêng, xem README "Khác biệt với tài liệu".
user ingest
topic read ems/v1/+/up/#
topic write ems/v1/+/down/config

# dispatcher (tools/ems_cli.py thay cho Command API): chỉ publish lệnh.
user dispatcher
topic write ems/v1/+/down/cmd

# healthcheck của container
user health
topic read $SYS/broker/uptime
