# Mosquitto 2.0 — PoC broker. MQTT 5 is enabled by default on this listener (protocol mqtt = 3.1/3.1.1/5).
# Auth: per-client username/password + ACL as a STAND-IN for mTLS. Production (07 §6.14, 10): mTLS
# with per-edge X.509 cert, CN = edge_id, `use_identity_as_username true`, listener 8883 only.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/config/acl.conf
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_packet_size 2097152          # 2 MB như mặc định Mosquitto 2.1 (07 §7.1); edge tự chia lô <= 256 KB
max_queued_messages 10000
max_inflight_messages 20
persistent_client_expiration 1d
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
