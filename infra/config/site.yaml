# Point mapping theo site (07 §6.3) — PoC. Một file dùng chung cho: edge bridge (đọc gì, pid nào),
# ingest (registry pid -> site/device/point_code), CSMS stub và virtual site (cổng Modbus của thiết bị).
# Production: đây là một phần của EdgeConfigVersion có ký số (05 §6); ở PoC không ký.
# sampling_class theo 07 §6.5: C1 đọc 1 s / gửi tổng hợp 5 s; C2 -> 60 s; C3 -> 300 s; C4 thanh ghi mỗi 60 s; C5 sự kiện.
config_version: 1
site_id: site-bd-01
timezone: Asia/Ho_Chi_Minh
edges:
